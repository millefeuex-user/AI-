stages:
  - check
  - deploy

check:
  image: node:20-alpine
  stage: check
  script:
    - npm run check

# Example deployment job for an internal Linux server.
# Copy this file to .gitlab-ci.yml and fill CI/CD variables in GitLab:
# SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH.
deploy_internal_server:
  image: alpine:3.20
  stage: deploy
  needs:
    - check
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete --exclude ".git" --exclude ".env" --exclude "backend/data/*.json" ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && npm run check && pm2 restart ai-scoring-system || pm2 start backend/server.js --name ai-scoring-system"
